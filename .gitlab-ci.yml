stages:
  - verification
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

api:tests:
  stage: verification
  image: php:8.4-cli-bookworm

  

  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git unzip libsqlite3-dev libzip-dev libonig-dev libxml2-dev curl
    - docker-php-ext-install pdo_sqlite zip mbstring dom
    - curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
    - php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer

  script:
    - cd hot-koki-api
    - composer install --no-interaction --prefer-dist --no-progress
    - |
      export APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
      php artisan test --compact

application:flutter-tests:
  stage: verification
  image: debian:bookworm-slim

  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends ca-certificates curl git unzip xz-utils
    - curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.50.0-stable.tar.xz -o /tmp/flutter.tar.xz
    - echo "6ea2d806fd57269ae783e6788e2a81fc26eaad782f1e0d0ff38623bb765ff9f5  /tmp/flutter.tar.xz" | sha256sum -c -
    - tar -xJf /tmp/flutter.tar.xz -C /opt
    # Le SDK est extrait en root dans /opt, tandis que GitLab peut lancer
    # Flutter sous un autre contexte Git : déclaration système impérative.
    - git config --system --add safe.directory /opt/flutter
    - git config --global --add safe.directory /opt/flutter
    - export PATH="/opt/flutter/bin:$PATH"
    - flutter --version

  script:
    - export PATH="/opt/flutter/bin:$PATH"
    - cd hot_koki_app
    - flutter pub get
    # Les informations de dépréciation du SDK ne doivent pas masquer une
    # vraie erreur d'analyse. Les warnings et erreurs restent bloquants.
    - flutter analyze --no-fatal-infos
    - flutter test

deploy:staging:
  stage: deploy
  image: alpine:3.20

  # Le staging demeure disponible pour les essais, mais son absence ne doit
  # jamais bloquer un déploiement production explicitement validé.
  allow_failure: true

  needs:
    - api:tests
    - application:flutter-tests

  environment:
    name: staging
    url: https://api-staging.hotkokichaud.digital

  resource_group: staging

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - when: never

  before_script:
    - apk add --no-cache openssh-client rsync curl
    - install -d -m 700 ~/.ssh

    # Reconstruction des secrets depuis les variables GitLab Base64.
    - printf '%s' "$STAGING_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - printf '%s' "$STAGING_KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
    - printf '%s' "$STAGING_ENV_FILE_B64" | base64 -d > .ci-staging.env
    - printf '%s' "$STAGING_FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > .ci-staging-firebase.json

    - chmod 600 ~/.ssh/id_ed25519
    - chmod 644 ~/.ssh/known_hosts
    - test -s .ci-staging.env
    - test -s .ci-staging-firebase.json

  script:
    # Transfère le code, sans écraser les secrets ou les données persistantes.
    # `public/storage` est un lien symbolique Laravel : son exclusion doit être
    # exacte, sinon rsync --delete peut le retirer à chaque déploiement.
    - >
      rsync -az --delete
      --exclude=".env"
      --exclude="storage/***"
      --exclude="public/storage"
      --exclude="vendor/"
      --exclude="node_modules/"
      --exclude=".git/"
      --exclude="bootstrap/cache/"
      -e "ssh -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes"
      hot-koki-api/
      "$STAGING_SSH_USER@$STAGING_SSH_HOST:$STAGING_DEPLOY_PATH/"

    # Prépare le répertoire non public des secrets Firebase.
    - >
      ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes
      "$STAGING_SSH_USER@$STAGING_SSH_HOST"
      "mkdir -p '$STAGING_DEPLOY_PATH/storage/app/secure'"

    # Transfère le .env et le compte Firebase de façon temporaire.
    - >
      scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes
      .ci-staging.env
      "$STAGING_SSH_USER@$STAGING_SSH_HOST:$STAGING_DEPLOY_PATH/.env.next"

    - >
      scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes
      .ci-staging-firebase.json
      "$STAGING_SSH_USER@$STAGING_SSH_HOST:$STAGING_DEPLOY_PATH/storage/app/secure/firebase-service-account.json.next"

    # Active les secrets puis lance le script Laravel.
    - >
      ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes
      "$STAGING_SSH_USER@$STAGING_SSH_HOST"
      "
      set -eu
      cd '$STAGING_DEPLOY_PATH'
      install -m 600 .env.next .env
      install -m 600 storage/app/secure/firebase-service-account.json.next storage/app/secure/firebase-service-account.json
      rm -f .env.next storage/app/secure/firebase-service-account.json.next
      APP_ENV=staging RUN_PAYMENT_PREFLIGHT=true bash scripts/deploy.sh
      "

    # Le pipeline ne réussit que si l'API staging répond après déploiement.
    - curl --fail --silent --show-error --retry 3 --retry-delay 3 "$STAGING_HEALTHCHECK_URL"

deploy:production:
  stage: deploy
  image: alpine:3.20

  needs:
    - api:tests
    - application:flutter-tests

  environment:
    name: production
    url: https://api.hotkokichaud.digital
    deployment_tier: production

  # Un seul deploiement production peut tourner a la fois.
  resource_group: production

  # Ce job reste manuel : une validation humaine est obligatoire avant toute
  # modification de la base et du service de production.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - when: never

  before_script:
    - apk add --no-cache openssh-client rsync curl
    - install -d -m 700 ~/.ssh

    # Les secrets production existent uniquement dans les variables GitLab.
    - printf '%s' "$PRODUCTION_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - printf '%s' "$PRODUCTION_KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
    - printf '%s' "$PRODUCTION_ENV_FILE_B64" | base64 -d > .ci-production.env
    - printf '%s' "$PRODUCTION_FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > .ci-production-firebase.json

    - chmod 600 ~/.ssh/id_ed25519
    - chmod 644 ~/.ssh/known_hosts
    - test -s .ci-production.env
    - test -s .ci-production-firebase.json

  script:
    # Le code est synchronise sans supprimer le .env, les medias, les logs
    # ni les secrets persistants du serveur. `public/storage` est un lien
    # symbolique : il doit être exclu sans slash final pour survivre à --delete.
    - >
      rsync -az --delete
      --exclude=".env"
      --exclude="storage/***"
      --exclude="public/storage"
      --exclude="vendor/"
      --exclude="node_modules/"
      --exclude=".git/"
      --exclude="bootstrap/cache/"
      -e "ssh -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes"
      hot-koki-api/
      "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST:$PRODUCTION_DEPLOY_PATH/"

    - >
      ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes
      "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
      "mkdir -p '$PRODUCTION_DEPLOY_PATH/storage/app/secure'"

    - >
      scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes
      .ci-production.env
      "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST:$PRODUCTION_DEPLOY_PATH/.env.next"

    - >
      scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes
      .ci-production-firebase.json
      "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST:$PRODUCTION_DEPLOY_PATH/storage/app/secure/firebase-service-account.json.next"

    # Les controles de deploiement et CamPay live sont bloquants en production.
    - >
      ssh -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes
      "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
      "
      set -eu
      cd '$PRODUCTION_DEPLOY_PATH'
      install -m 600 .env.next .env
      install -m 600 storage/app/secure/firebase-service-account.json.next storage/app/secure/firebase-service-account.json
      rm -f .env.next storage/app/secure/firebase-service-account.json.next
      APP_ENV=production RUN_PAYMENT_PREFLIGHT=true bash scripts/deploy.sh
      "

    - curl --fail --silent --show-error --retry 3 --retry-delay 3 "$PRODUCTION_HEALTHCHECK_URL"
